# Configuration Nginx pour TECHNOVA
# À utiliser si vous n'utilisez pas Dokploy/Traefik

upstream technova_backend {
    server localhost:3000;
    keepalive 64;
}

# HTTP - Redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name technova.votredomaine.com;

    # Redirection permanente vers HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name technova.votredomaine.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/technova.votredomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technova.votredomaine.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/technova.votredomaine.com/chain.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logs
    access_log /var/log/nginx/technova_access.log;
    error_log /var/log/nginx/technova_error.log;

    # Client body size (pour les uploads)
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    gzip_disable "MSIE [1-6]\.";

    # Root location - Proxy vers Node.js
    location / {
        proxy_pass http://technova_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache
        proxy_cache_bypass $http_upgrade;
    }

    # API routes avec timeouts plus longs
    location /api/ {
        proxy_pass http://technova_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts plus longs pour les API
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Static files avec cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://technova_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (sans cache)
    location /api/health {
        proxy_pass http://technova_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}

# Configuration additionnelle pour www (optionnel)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name www.technova.votredomaine.com;

    # SSL (même certificat)
    ssl_certificate /etc/letsencrypt/live/technova.votredomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technova.votredomaine.com/privkey.pem;

    # Redirection vers non-www
    return 301 https://technova.votredomaine.com$request_uri;
}
